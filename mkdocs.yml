site_name: AI Agent Governance Framework
site_description: Framework vendor-neutral para governar sistemas de IA e agentes do mandato executivo ao runtime.
site_author: AI Agent Governance Framework Maintainers
copyright: CC BY 4.0 — provenance preserved in the repository

docs_dir: site_src
site_dir: site

theme:
  name: material
  language: pt-BR
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences

plugins:
  - search:
      lang:
        - pt
        - en

nav:
  - Início: README.md
  - Comece a implantar:
      - Rota de implantação: docs/start-here.md
      - Guia de consumo: CONSUMO.md
      - Brief executivo: docs/executive/governing-agents-at-scale.md
      - Implementation playbook: docs/framework/08-implementation-and-adoption.md
  - Estude o framework:
      - Handbook: docs/handbook/README.md
      - Visão geral dos capítulos: docs/framework/README.md
      - 00 — Controle do documento: docs/framework/00-document-control.md
      - 01 — Mandato, escopo e princípios: docs/framework/01-mandate-scope-and-principles.md
      - 02 — Governança e accountability: docs/framework/02-governance-and-accountability.md
      - 03 — Inventário, portfólio e valor: docs/framework/03-inventory-portfolio-and-value.md
      - 04 — Risco, impacto e compliance: docs/framework/04-risk-impact-and-compliance.md
      - 05 — Lifecycle de agentes: docs/framework/05-agent-lifecycle.md
      - 06 — Arquitetura e controles técnicos: docs/framework/06-architecture-and-technical-controls.md
      - 07 — Avaliação, evidência e assurance: docs/framework/07-evaluation-evidence-and-assurance.md
      - 08 — Implementação e adoção: docs/framework/08-implementation-and-adoption.md
      - 09 — Operações, incidentes e continuidade: docs/framework/09-operations-incidents-and-continuity.md
      - 10 — Métricas, revisão e melhoria: docs/framework/10-metrics-review-and-improvement.md
  - Localize uma resposta:
      - Índice por persona e objetivo: docs/index.md
      - Glossário: docs/annexes/glossary.md
      - Checklist de autossuficiência: docs/reference/self-sufficiency-checklist.md
  - Toolkit de execução:
      - Visão geral: toolkit/README.md
      - Catálogo de artefatos: toolkit/artifact-catalog.md
      - Controles: toolkit/controls/README.md
      - Minimum Production Bar: toolkit/controls/minimum-production-bar.md
      - Schemas: toolkit/schemas/README.md
      - Templates: toolkit/templates/README.md
      - Registry: toolkit/registry/README.md
      - Patterns: toolkit/patterns/README.md
      - Casos de referência: toolkit/examples/cases/README.md
  - Arquitetura e decisões:
      - Arquitetura: docs/architecture/README.md
      - Decision log: docs/architecture/decision-log.md
      - Migração de contratos: docs/migration/governance-contracts-1x-to-2x.md
  - Fontes e limitações:
      - Research: research/README.md
      - Bibliografia: research/sources/bibliography.md
      - Case studies: research/case-studies/README.md
      - Crosswalks: research/crosswalks/README.md
  - Manutenção do corpus:
      - Contribuição: CONTRIBUTING.md
      - Changelog: CHANGELOG.md
      - Roadmap: ROADMAP.md
