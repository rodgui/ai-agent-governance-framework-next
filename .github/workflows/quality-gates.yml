name: Quality gates

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --requirement requirements-ci.txt --requirement requirements-docs.txt
      - run: python tools/scripts/validate-repository.py
      - run: python -m unittest discover -s tools/scripts -p 'test_*.py'
      - run: python -m py_compile tools/*.py tools/scripts/*.py
      - run: python tools/build-docs-site.py
      - run: python tools/render-agent-governance-infographic.py --output-dir "$RUNNER_TEMP/rendered"
