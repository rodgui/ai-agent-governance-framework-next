name: Quality gates

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --requirement requirements-ci.txt --requirement requirements-docs.txt
      - name: Resolve base commit
        env:
          CANDIDATE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$CANDIDATE_BASE"
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}"; then
            base="$(git rev-list --max-parents=0 "$GITHUB_SHA" | tail -n 1)"
          fi
          echo "BASE_SHA=$base" >> "$GITHUB_ENV"
      - name: Validate changed Markdown
        run: |
          mapfile -d '' files < <(
            git diff --name-only --diff-filter=ACMR -z \
              "$BASE_SHA" "$GITHUB_SHA" -- '*.md'
          )
          if ((${#files[@]})); then
            npx --yes markdownlint-cli2@0.18.1 "${files[@]}"
          else
            echo "No changed Markdown files."
          fi
      - run: python tools/scripts/validate-repository.py
      - run: python -m unittest discover -s tools/scripts -p 'test_*.py'
      - run: |
          ruff check tools/scripts
          python -m py_compile tools/*.py tools/scripts/*.py
      - run: python tools/build-docs-site.py
      - run: python tools/render-agent-governance-infographic.py --output-dir "$RUNNER_TEMP/rendered"
      - name: Detect whitespace errors
        run: git diff --check "$BASE_SHA" "$GITHUB_SHA"
