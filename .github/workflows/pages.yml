name: Build documentation artifact (manual; no publication in Gate 1)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --requirement requirements-docs.txt
      - run: python tools/build-docs-site.py
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-site
          path: site
          if-no-files-found: error
