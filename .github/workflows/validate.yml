name: Validate
on:
  workflow_dispatch:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-ci.txt -r requirements-docs.txt
      - run: python tools/scripts/validate-repository.py
      - run: python -m unittest discover -s tools/scripts -p 'test_*.py'
      - run: python tools/build-docs-site.py
